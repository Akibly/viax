<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17213A">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ViaX — grounded viva practice from your own course material">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ViaX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ViaX · Viva practice from your notes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F7F4ED; color: #171A21; font-family: Roboto, system-ui, sans-serif; }
    #boot { min-height: 100dvh; display: grid; place-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    #boot img { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { max-width: 36ch; line-height: 1.5; margin: 0 auto 16px; color: #636B78; }
    button { font: inherit; padding: 12px 24px; color: white; background: #3157D5; border: 0; border-radius: 14px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #3157D5; outline-offset: 4px; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) { body { background: #0E1118; color: #F3F5F8; } p { color: #AEB5C2; } }
  </style>
</head>
<body>
  <main id="boot" aria-label="Loading ViaX">
    <img src="icons/Icon-192.png" alt="" width="64" height="64">
    <h1>ViaX</h1>
    <p id="boot-status" role="status">Preparing your practice space…</p>
    <button id="boot-retry" hidden onclick="location.reload()">Try again</button>
    <noscript><p>Enable JavaScript to open your practice space.</p></noscript>
  </main>
  <script>
    window.viaxLoadFailed = function () {
      const status = document.getElementById('boot-status');
      if (!status) return;
      status.textContent = 'Loading is taking longer than expected. Check your connection and try again.';
      document.getElementById('boot-retry').hidden = false;
    };
    window.viaxLoadTimer = setTimeout(window.viaxLoadFailed, 30000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="viaxLoadFailed()"></script>
</body>
</html>
