org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Plugin sources live in the global Pub cache on C: while this project lives
# on D:. Kotlin's incremental cache cannot relativize paths across Windows
# drive roots and can leave downstream D8 output corrupted after its daemon
# falls back. Compile Kotlin in-process without that cross-drive cache.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
